<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Wibe — local AI bridge built on Code - OSS</title>

  <defs>
    <!-- 深色底：接近墨绿的暗色，亮暗主题下观感一致 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071A10"/>
      <stop offset="100%" stop-color="#0C2A19"/>
    </linearGradient>

    <!-- 柔和、偏产品插画风格的阴影（沿用 reference_shape 原参数） -->
    <filter id="panelShadow" x="-25%" y="-25%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="7.14" dy="11.42" stdDeviation="9.99" flood-color="#0B1F14" flood-opacity="0.35"/>
    </filter>

    <!-- 标志配色：沿用原 reference_shape_vscode.svg 的绿色渐变 -->
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12FF86"/>
      <stop offset="100%" stop-color="#00F06E"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B85D"/>
      <stop offset="100%" stop-color="#00A34D"/>
    </linearGradient>
    <!-- 拱肩落影：沿箭头线段，向腿内侧衰减 -->
    <linearGradient id="springShade" gradientUnits="userSpaceOnUse" x1="258.68" y1="233.85" x2="242.69" y2="323.78">
      <stop offset="0%" stop-color="#00220C" stop-opacity="0.46"/>
      <stop offset="26%" stop-color="#00220C" stop-opacity="0.30"/>
      <stop offset="62%" stop-color="#00220C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#00220C" stop-opacity="0"/>
    </linearGradient>

    <!-- 字标渐变 -->
    <linearGradient id="textGrad" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="300">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9BFFCF"/>
    </linearGradient>

    <!-- 拱门后的绿色辉光 -->
    <radialGradient id="markGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00F06E" stop-opacity="0.17"/>
      <stop offset="60%" stop-color="#00F06E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00F06E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="farGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00F06E" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00F06E" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="frontClip">
      <path d="M 612.73 89.14 L 613.93 144.51 Q 614.04 149.65 609.15 151.22 L 324.94 242.28 Q 320.05 243.84 320.05 248.98 L 320.05 846.96 Q 320.05 849.1 317.99 848.49 L 203.64 814.29 Q 201.59 813.68 201.56 811.54 L 194.52 230.43 Q 194.46 225.29 199.32 223.64 L 607.75 85.64 Q 612.62 84 612.73 89.14 Z"/>
    </clipPath>
  </defs>

  <!-- 底板 -->
  <rect x="0" y="0" width="1600" height="400" rx="28" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1598" height="398" rx="27" fill="none" stroke="#1D5136" stroke-opacity="0.55" stroke-width="2"/>

  <!-- 环境光 -->
  <ellipse cx="227" cy="205" rx="360" ry="300" fill="url(#markGlow)"/>
  <ellipse cx="1480" cy="70" rx="460" ry="300" fill="url(#farGlow)"/>

  <!-- 右侧拱门轮廓回声（线稿水印） -->
  <g transform="translate(1230,-30) scale(0.6)" fill="none" stroke="#19FF8A" stroke-opacity="0.08" stroke-width="4" stroke-linejoin="round">
    <path d="M 612.73 89.14 L 613.93 144.51 Q 614.04 149.65 609.15 151.22 L 324.94 242.28 Q 320.05 243.84 320.05 248.98 L 320.05 846.96 Q 320.05 849.1 317.99 848.49 L 203.64 814.29 Q 201.59 813.68 201.56 811.54 L 194.52 230.43 Q 194.46 225.29 199.32 223.64 L 607.75 85.64 Q 612.62 84 612.73 89.14 Z"/>
    <path d="M 622.59 85.88 L 822.43 152.05 Q 828.12 153.93 828.13 159.93 L 829.53 872.94 Q 829.54 878.93 823.8 880.64 L 626.08 939.39 Q 624.03 940 624.01 937.86 L 616.95 89.99 Q 616.9 84 622.59 85.88 Z"/>
  </g>

  <!-- 产品标志：reference_shape_vscode.svg 的拱桥原样缩放 -->
  <g transform="translate(84,51.5) scale(0.29)">
    <g filter="url(#panelShadow)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 612.73 89.14 L 613.93 144.51 Q 614.04 149.65 609.15 151.22 L 324.94 242.28 Q 320.05 243.84 320.05 248.98 L 320.05 846.96 Q 320.05 849.1 317.99 848.49 L 203.64 814.29 Q 201.59 813.68 201.56 811.54 L 194.52 230.43 Q 194.46 225.29 199.32 223.64 L 607.75 85.64 Q 612.62 84 612.73 89.14 Z" fill="url(#leftPanel)"/>
      <path d="M 320.05 243.84 L 614.04 149.65" fill="none" stroke="#00E96D" stroke-width="2.85" stroke-opacity="0.28"/>
      <path d="M 622.59 85.88 L 822.43 152.05 Q 828.12 153.93 828.13 159.93 L 829.53 872.94 Q 829.54 878.93 823.8 880.64 L 626.08 939.39 Q 624.03 940 624.01 937.86 L 616.95 89.99 Q 616.9 84 622.59 85.88 Z" fill="url(#rightPanel)"/>
      <path d="M 619.75 85.43 L 828.12 153.93" fill="none" stroke="#19C96E" stroke-width="2.85" stroke-opacity="0.22"/>
      <g clip-path="url(#frontClip)">
        <path d="M 171.97 218.44 L 345.38 249.27 L 329.4 339.2 L 155.99 308.37 Z" fill="url(#springShade)"/>
        <path d="M 194.46 222.44 L 322.9 245.27" fill="none" stroke="#EAFFF3" stroke-opacity="0.33" stroke-width="2.57"/>
      </g>
    </g>
  </g>

  <!-- 竖分隔线 -->
  <rect x="372" y="118" width="5" height="164" rx="2.5" fill="url(#leftPanel)" opacity="0.9"/>

  <!-- 产品名 -->
  <text x="408" y="232" font-family="'Segoe UI','Segoe UI Variable Display',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="168" font-weight="800" letter-spacing="1" fill="url(#textGrad)">Wibe</text>

  <!-- 副标题 -->
  <text x="412" y="292" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="29" font-weight="600" letter-spacing="5.5" fill="#7FE9B0" fill-opacity="0.92">LOCAL AI BRIDGE · CODE-OSS 1.136.1</text>
</svg>
